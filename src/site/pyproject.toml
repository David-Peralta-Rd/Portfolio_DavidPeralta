[project]
name = "portfolio"
version = "0.1.0"
authors = [
    { name = "David-Peralta-Rd", email = "crdavidperalta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "livereload>=2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
serve = "portfolio.cli:serve"
build = "portfolio.cli:build"

# scaffold
[tool.hatch.build.targets.wheel]
packages = ["portfolio"]

# scaffold
[tool.uv]
prerelease = "disallow"

# scaffold
[tool.pytest.ini_options]
testpaths = ["tests"]

# scaffold
[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
